<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">SOC Simulation Lab — Architecture</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#666">Wazuh + ELK on VMware Workstation Pro (Windows 11 Host, 16GB RAM)</text>

  <!-- Host boundary -->
  <rect x="30" y="80" width="940" height="500" rx="10" fill="#f7f7f9" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="105" font-size="13" font-weight="bold" fill="#555">Windows 11 Host (VMware Workstation Pro)</text>

  <!-- Browser box (host side) -->
  <rect x="60" y="120" width="200" height="70" rx="8" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="160" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3d7a">Browser (Host)</text>
  <text x="160" y="167" text-anchor="middle" font-size="11" fill="#333">Wazuh Dashboard UI</text>
  <text x="160" y="182" text-anchor="middle" font-size="10" fill="#666">https://192.168.72.136</text>

  <!-- NAT network boundary -->
  <rect x="60" y="230" width="880" height="320" rx="10" fill="#fbfbfb" stroke="#999" stroke-width="1.5"/>
  <text x="80" y="253" font-size="13" font-weight="bold" fill="#555">VMware NAT Network — VMnet8 (192.168.72.0/24)</text>

  <!-- Wazuh Server VM -->
  <rect x="100" y="280" width="230" height="150" rx="8" fill="#e8f6ee" stroke="#2f9e58" stroke-width="1.5"/>
  <text x="215" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d5c34">Wazuh Server</text>
  <text x="215" y="323" text-anchor="middle" font-size="10.5" fill="#333">Ubuntu Server 24.04 LTS</text>
  <text x="215" y="339" text-anchor="middle" font-size="10.5" fill="#333">4GB RAM / 2 vCPU / 40GB</text>
  <text x="215" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d5c34">192.168.72.136</text>
  <text x="215" y="380" text-anchor="middle" font-size="10" fill="#555">Wazuh Manager</text>
  <text x="215" y="395" text-anchor="middle" font-size="10" fill="#555">Wazuh Indexer</text>
  <text x="215" y="410" text-anchor="middle" font-size="10" fill="#555">Wazuh Dashboard</text>

  <!-- Ubuntu Endpoint VM -->
  <rect x="400" y="280" width="230" height="150" rx="8" fill="#fff6e6" stroke="#d69b1a" stroke-width="1.5"/>
  <text x="515" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6100">Ubuntu Endpoint</text>
  <text x="515" y="323" text-anchor="middle" font-size="10.5" fill="#333">Ubuntu Server 24.04 LTS</text>
  <text x="515" y="339" text-anchor="middle" font-size="10.5" fill="#333">2GB RAM / 1 vCPU / 20GB</text>
  <text x="515" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6100">192.168.72.137</text>
  <text x="515" y="380" text-anchor="middle" font-size="10" fill="#555">Wazuh Agent</text>
  <text x="515" y="395" text-anchor="middle" font-size="10" fill="#555">Monitored SSH service</text>
  <text x="515" y="410" text-anchor="middle" font-size="10" fill="#555">(victim host)</text>

  <!-- Kali VM -->
  <rect x="700" y="280" width="230" height="150" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="815" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1f17">Kali Linux</text>
  <text x="815" y="323" text-anchor="middle" font-size="10.5" fill="#333">Kali Installer (Xfce)</text>
  <text x="815" y="339" text-anchor="middle" font-size="10.5" fill="#333">4GB RAM / 2 vCPU / 60GB</text>
  <text x="815" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1f17">192.168.72.134</text>
  <text x="815" y="380" text-anchor="middle" font-size="10" fill="#555">Attacker VM</text>
  <text x="815" y="395" text-anchor="middle" font-size="10" fill="#555">Hydra (SSH brute force)</text>
  <text x="815" y="410" text-anchor="middle" font-size="10" fill="#555">powered on for demos only</text>

  <!-- Gateway note -->
  <text x="500" y="470" text-anchor="middle" font-size="10.5" fill="#777">Gateway: 192.168.72.2  |  All VMs internet-accessible via NAT, isolated from home LAN</text>

  <!-- Attack flow arrow: Kali -> Endpoint -->
  <path d="M700,355 L630,355" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="345" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="bold">① SSH brute force</text>

  <!-- Agent -> Manager arrow -->
  <path d="M400,355 L330,355" fill="none" stroke="#2f9e58" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="345" text-anchor="middle" font-size="9.5" fill="#2f9e58" font-weight="bold">② Logs forwarded</text>

  <!-- Manager -> Browser arrow -->
  <path d="M215,280 L215,240 L160,240 L160,190" fill="none" stroke="#4a7fd6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="220" text-anchor="middle" font-size="9.5" fill="#4a7fd6" font-weight="bold">③ Alerts viewed</text>
  <text x="140" y="232" text-anchor="middle" font-size="9.5" fill="#4a7fd6" font-weight="bold">via HTTPS</text>

  <!-- Legend / flow summary -->
  <rect x="60" y="565" width="880" height="55" rx="8" fill="#f0f0f0" stroke="#ccc"/>
  <text x="500" y="588" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">Attack Flow: Kali runs Hydra against Ubuntu Endpoint's SSH → Wazuh Agent detects auth failures →</text>
  <text x="500" y="605" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">forwards to Wazuh Manager → Rule 5763 (brute force) fires → Alert visible in Dashboard</text>
</svg>
